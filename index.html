<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px 24px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; color: #fff; }
        header span { font-size: 12px; color: #666; }
        #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .agent { align-self: flex-start; background: #1e1e1e; color: #e0e0e0; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; }
        .agent.thinking { color: #666; font-style: italic; }
        footer { padding: 16px 24px; background: #1a1a1a; border-top: 1px solid #2a2a2a; display: flex; gap: 12px; align-items: center; }
        #input { flex: 1; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #e0e0e0; font-size: 14px; outline: none; resize: none; height: 44px; }
        #input:focus { border-color: #2563eb; }
        button { padding: 10px 20px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; font-weight: 500; }
        #send { background: #2563eb; color: #fff; }
        #send:hover { background: #1d4ed8; }
        #send:disabled { background: #1e3a6e; color: #666; cursor: not-allowed; }
        #clear { background: #2a2a2a; color: #999; border: 1px solid #333; }
        #clear:hover { background: #333; color: #e0e0e0; }
        .tools { font-size: 11px; color: #555; margin-top: 6px; }
    </style>
</head>
<body>
    <header>
        <h1>AI Agent</h1>
        <span>weather · calculator · web search</span>
    </header>
    <div id="chat">
        <div class="message agent">Hey! Ask me anything. I can check the weather, do math, or search the web.</div>
    </div>
    <footer>
        <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
        <button id="clear">Clear</button>
        <button id="send">Send</button>
    </footer>
    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const clearBtn = document.getElementById("clear");

        function addMessage(text, role) {
            const div = document.createElement("div");
            div.className = `message ${role}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            sendBtn.disabled = true;
            addMessage(text, "user");
            const thinking = addMessage("Thinking...", "agent thinking");
            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                thinking.remove();
                addMessage(data.response, "agent");
            } catch (e) {
                thinking.remove();
                addMessage("Something went wrong. Try again.", "agent");
            }
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.addEventListener("click", sendMessage);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        clearBtn.addEventListener("click", async () => {
            await fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({reset: true})});
            chat.innerHTML = '<div class="message agent">Conversation cleared. Ask me anything!</div>';
        });
    </script>
</body>
</html>
